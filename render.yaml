services:
  # Auth Microservice - Core Authentication
  - type: web
    name: mediflow-auth
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.auth
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        value: mediFlowSecureSecretKeyForProductionDeploymentWithSufficientLengthForHS512Algorithm2024
      - key: JWT_EXPIRATION
        value: 900000
      # Supabase Session-pooler connection (IPv4-compatible, required on Render).
      # Set the values in the Render dashboard — never commit real credentials.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false

