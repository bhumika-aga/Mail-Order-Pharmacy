server:
  port: ${PORT}
  # Behind the hosting proxy (TLS ends there): take scheme and host from the
  # X-Forwarded-* headers, so the API docs advertise the public https:// URL.
  forward-headers-strategy: framework

spring:
  flyway:
    # Schema migrations only: never the dev seed data
    locations: classpath:db/migration
    # If the database is momentarily out of connections (e.g. several services
    # deploying at once), wait and retry (1s, 2s, 4s ...) instead of failing.
    connect-retries: 6
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Supabase's free session pooler admits 15 clients across ALL services, and
      # during a deploy old and new instances run side by side. 2 is the minimum
      # Flyway needs at start-up; idle connections are handed back after 30s.
      maximum-pool-size: 2
      minimum-idle: 0
      idle-timeout: 30000
      connection-timeout: 10000
      data-source-properties:
        sslmode: require
        # Disables server-side prepared statements so the Supabase connection
        # pooler (PgBouncer) can safely hand connections between clients.
        prepareThreshold: 0
  jpa:
    hibernate:
      # Flyway owns the schema (db/migration); Hibernate only checks it matches
      ddl-auto: validate
    # SQL logging off in production (queries touch member/prescription data)
    show-sql: false
    properties:
      hibernate:
        "format_sql": true
  sql:
    init:
      mode: never

jwt:
  secret: ${JWT_SECRET}

# Services this one calls
subscription:
  service:
    url: ${SUBSCRIPTION_SERVICE_URL}
drugs:
  service:
    url: ${DRUGS_SERVICE_URL}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Public endpoint: report UP/DOWN only, not database/disk details
      show-details: never

logging:
  level:
    "com.pharmacy": INFO

# Browser origins allowed to call this API, e.g. https://mediflow.example.com
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
