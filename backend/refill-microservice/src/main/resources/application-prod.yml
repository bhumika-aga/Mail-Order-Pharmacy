server:
  port: ${PORT}

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      data-source-properties:
        sslmode: require
        # Required for Supabase transaction pooler (PgBouncer): disables
        # server-side prepared statements so pooled connections can be reused.
        prepareThreshold: 0
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        "format_sql": true
    generate-ddl: true
  sql:
    init:
      mode: never

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

services:
  auth:
    url: ${AUTH_SERVICE_URL}
  subscription:
    url: ${SUBSCRIPTION_SERVICE_URL}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    "com.pharmacy": INFO

# Browser origins allowed to call this API, e.g. https://mediflow.example.com
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
