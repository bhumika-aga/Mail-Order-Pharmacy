server:
  port: 8083

spring:
  autoconfigure:
    # JWT-only service: no default in-memory user (and no generated password in the log)
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  application:
    name: refill-microservice
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  flyway:
    # Schema changes are versioned SQL in db/migration; Hibernate only validates.
    # All services share one database, so each keeps its own history table, and
    # baselining at version 0 lets V1 (CREATE TABLE IF NOT EXISTS) run even when
    # other services' tables already exist.
    table: flyway_history_refill
    baseline-on-migrate: true
    baseline-version: 0
    # Dev/demo data (repeatable migration). Production overrides this to db/migration only.
    locations: classpath:db/migration,classpath:db/seed
  jpa:
    # Don't hold a DB connection for the whole request (e.g. while calling other services)
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  secret: ${JWT_SECRET}
  expiration: 900000

# External service URLs
subscription:
  service:
    url: http://localhost:8082

drugs:
  service:
    url: http://localhost:8081

logging:
  level:
    com.pharmacy.refill: DEBUG
    org.springframework.security: DEBUG

# API docs are deliberately on in every environment: the Swagger aggregator
# reads each service's /v3/api-docs.
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

# External service URLs
subscription:
  service:
    url: http://localhost:8082

drugs:
  service:
    url: http://localhost:8081
