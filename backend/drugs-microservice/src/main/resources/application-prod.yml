server:
  port: ${PORT}

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      data-source-properties:
        sslmode: require
        # Disables server-side prepared statements so the Supabase connection
        # pooler (PgBouncer) can safely hand connections between clients.
        prepareThreshold: 0
  jpa:
    hibernate:
      ddl-auto: update
    # SQL logging off in production (queries touch member/prescription data)
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
    generate-ddl: true
  sql:
    init:
      mode: never

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

services:
  auth:
    url: ${AUTH_SERVICE_URL}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Public endpoint: report UP/DOWN only, not database/disk details
      show-details: never

logging:
  level:
    com.pharmacy: INFO

# Browser origins allowed to call this API, e.g. https://mediflow.example.com
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
