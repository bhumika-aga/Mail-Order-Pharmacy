server:
  port: ${PORT:8085}
  # Behind the hosting proxy (TLS ends there): build redirects with the public https:// URL.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Public endpoint: report UP/DOWN only, not disk/system details
      show-details: never

logging:
  level:
    com.pharmacy: INFO
