server:
  port: ${PORT:8085}

spring:
  application:
    name: swagger-aggregator

# Single Swagger UI that switches between each service's live spec via the
# top-right dropdown. URLs default to local dev ports and are overridden by the
# *_SERVICE_URL environment variables in deployed environments.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: Auth Service
        url: ${AUTH_SERVICE_URL:http://localhost:8084}/v3/api-docs
      - name: Drugs Service
        url: ${DRUGS_SERVICE_URL:http://localhost:8081}/v3/api-docs
      - name: Subscription Service
        url: ${SUBSCRIPTION_SERVICE_URL:http://localhost:8082}/v3/api-docs
      - name: Refill Service
        url: ${REFILL_SERVICE_URL:http://localhost:8083}/v3/api-docs
